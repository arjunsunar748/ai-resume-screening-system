services:
  - type: web
    name: ai-ats-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: AI Resume Screening & ATS System
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false